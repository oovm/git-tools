[package]
name = "git-tools"
version = "0.4.0"
authors = ["Aster <192607617@qq.com>"]
description = "Git utilities built on gix: blob scanner and commit message reword"
readme = "readme.md"
license = "MPL-2.0"
edition = "2021"

[lib]
name = "git_tools"
path = "src/lib.rs"

[[bin]]
name = "bfg"
path = "bin/bfg.rs"

[[bin]]
name = "git-reword"
path = "bin/git-reword.rs"

[dependencies]
byte-unit = "5.1"
clap = { version = "4.5", features = ["derive"] }
gix = { version = "0.68", default-features = false, features = ["revision", "max-performance-safe"] }
gix-error = "0.3.2"
regex = "1.11"

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"

[profile.release]
lto = true
panic = "abort"
