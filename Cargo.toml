[package]
name = "git-tools"
version = "0.3.2"
authors = ["Aster <192607617@qq.com>"]
description = "Git utilities built on gix: blob scanner, commit reword/retime, and release change-logs"
readme = "readme.md"
license = "MPL-2.0"
edition = "2021"

[lib]
name = "git_tools"
path = "src/lib.rs"

[[bin]]
name = "bfg"
path = "bin/bfg.rs"

[[bin]]
name = "git-reword"
path = "bin/git-reword.rs"

[[bin]]
name = "git-retime"
path = "bin/git-retime.rs"

[[bin]]
name = "git-change-logs"
path = "bin/git-change-logs.rs"

[dependencies]
byte-unit = "5.1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
gix = { version = "0.68", default-features = false, features = ["revision", "max-performance-safe"] }
gix-error = "0.3.2"
miette = { version = "7.0", features = ["fancy"] }
rand = "0.8"
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }
urlencoding = "2.1"

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
missing_crate_level_docs = "deny"

[profile.release]
lto = true
panic = "abort"
