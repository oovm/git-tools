[workspace]
resolver = "2"
members = ["projects/*"]
default-members = [
    "projects/git-bfg",
    "projects/git-reword",
]
exclude = [
    "projects/.DS_Store",
]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
authors = ["Aster <192607617@qq.com>"]

[workspace.dependencies]
gix = { version = "0.68", default-features = false, features = ["revision", "max-performance-safe"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
regex = "1.11"
byte-unit = "5.1"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
missing_crate_level_docs = "deny"

[profile.release]
lto = true
panic = "abort"
