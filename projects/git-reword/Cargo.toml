[package]
name = "git-reword"
version = "0.1.0"
description = "Rewrite commit messages at the git object layer without interactive rebase"
readme = "Readme.md"
authors.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
gix = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }

[lib]
name = "git_reword"
path = "src/lib.rs"

[[bin]]
name = "git-reword"
path = "src/main.rs"
